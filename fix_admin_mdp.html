<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fix Admin — Mot de passe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#1A2540 0%,#0D1829 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;border-radius:20px;padding:32px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
h1{color:#1A2540;font-size:18px;font-weight:800;text-align:center;margin-bottom:4px}
.sub{color:#9AA3B2;font-size:12px;text-align:center;margin-bottom:24px}
.fl{font-size:11px;font-weight:700;color:#5A6478;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px;margin-top:14px}
.inp{width:100%;padding:12px 14px;border:2px solid #E2E6EE;border-radius:8px;font-size:14px;font-family:inherit;background:#F4F6FA}
.inp:focus{outline:none;border-color:#C8341A;background:white}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;background:#C8341A;color:white;margin-top:16px}
.btn:hover{background:#9E2510}
.btn:disabled{opacity:.4;cursor:not-allowed}
.log{background:#1A1C22;border-radius:10px;padding:14px;font-size:12px;font-family:monospace;margin-top:14px;line-height:2.2;max-height:300px;overflow-y:auto;display:none}
.ok{color:#4ADE80}.err{color:#F87171}.info{color:#93C5FD}
</style>
</head>
<body>
<div class="card">
  <div style="text-align:center;font-size:40px;margin-bottom:10px">🔑</div>
  <h1>Réinitialiser le compte Admin</h1>
  <p class="sub">Multi Auto Dépannage</p>

  <span class="fl">Nouveau mot de passe admin</span>
  <input class="inp" id="new-mdp" type="password" placeholder="Minimum 6 caractères">

  <span class="fl">Confirmer le mot de passe</span>
  <input class="inp" id="confirm-mdp" type="password" placeholder="Répéter le mot de passe">

  <button class="btn" id="btn" onclick="reinitialiser()">✅ Réinitialiser le mot de passe</button>
  <div class="log" id="log"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyB0pp8ZysKVomkmmx3uYWJZHtiFpvSPJi4",
  authDomain:"multiauto-depannage.firebaseapp.com",
  projectId:"multiauto-depannage",
  storageBucket:"multiauto-depannage.firebasestorage.app",
  messagingSenderId:"389555321846",
  appId:"1:389555321846:web:da201dce0fee10e32fe5d7"
});
const auth=firebase.auth();
const db=firebase.firestore();

function log(msg,type="info"){
  const el=document.getElementById("log");
  el.style.display="block";
  el.innerHTML+=`<div class="${type}">${msg}</div>`;
  el.scrollTop=el.scrollHeight;
}

// Essayer tous les anciens mots de passe connus
const MDP_CONNUS=["kz0810","kz08100","admin123","password","123456","multiauto"];

async function reinitialiser(){
  const mdp1=document.getElementById("new-mdp").value;
  const mdp2=document.getElementById("confirm-mdp").value;

  if(!mdp1||mdp1.length<6){log("❌ Mot de passe minimum 6 caractères","err");return;}
  if(mdp1!==mdp2){log("❌ Les mots de passe ne correspondent pas","err");return;}

  document.getElementById("btn").disabled=true;
  document.getElementById("log").innerHTML="";

  log("🔍 Tentative de connexion admin...","info");

  let connecte=false;

  // Essayer tous les mots de passe connus
  for(const mdp of MDP_CONNUS){
    log(`   Test mot de passe : ${mdp}...`,"info");
    try{
      await auth.signInWithEmailAndPassword("admin@multiauto.fr", mdp);
      log(`   ✅ Connexion réussie avec : ${mdp}`,"ok");
      connecte=true;
      break;
    }catch(e){
      log(`   ✗ Échec`,"err");
    }
  }

  if(!connecte){
    log("❌ Impossible de se connecter avec les mots de passe connus","err");
    log("💡 Solution : Firebase Console → Authentication → 3 points → Supprimer","info");
    log("   Puis relancez ce script pour recréer le compte admin","info");
    document.getElementById("btn").disabled=false;
    return;
  }

  // Changer le mot de passe
  log("🔑 Changement du mot de passe...","info");
  try{
    await auth.currentUser.updatePassword(mdp1);
    log("✅ Mot de passe changé !","ok");

    // Mettre à jour Firestore
    await db.collection("users").doc(auth.currentUser.uid).update({
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    log("","info");
    log("🎉 TERMINÉ !","ok");
    log(`   Email    : admin@multiauto.fr`,"ok");
    log(`   Identifiant : admin`,"ok");
    log(`   Mot de passe : ${mdp1}`,"ok");
    log("","info");
    log("Vous pouvez maintenant vous connecter à l'admin 🚀","ok");

  }catch(e){
    log("❌ Erreur : "+e.message,"err");
    document.getElementById("btn").disabled=false;
  }
}
</script>
</body>
</html>
