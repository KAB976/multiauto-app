<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fix Camions</title>
<style>
body{font-family:Arial,sans-serif;background:#1A2540;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:white;border-radius:16px;padding:28px;width:100%;max-width:440px;text-align:center}
h2{color:#C8341A;margin-bottom:20px}
.btn{width:100%;padding:16px;background:#C8341A;color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
.log{background:#F4F4F4;border-radius:8px;padding:14px;font-size:13px;font-family:monospace;margin-top:16px;text-align:left;line-height:2;max-height:350px;overflow-y:auto}
.ok{color:#1A7A40}.err{color:#C8341A}.info{color:#1565C0}.warn{color:#BA7517}
</style>
</head>
<body>
<div class="card">
  <h2>🔧 Corriger les camions</h2>
  <p style="font-size:12px;color:#888;margin-bottom:16px">Remplace les UID par les vrais noms des chauffeurs</p>
  <button class="btn" onclick="fixCamions()">✅ Corriger tous les camions</button>
  <div class="log" id="log">En attente...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyB0pp8ZysKVomkmmx3uYWJZHtiFpvSPJi4",
  authDomain: "multiauto-depannage.firebaseapp.com",
  projectId: "multiauto-depannage",
  storageBucket: "multiauto-depannage.firebasestorage.app",
  messagingSenderId: "389555321846",
  appId: "1:389555321846:web:da201dce0fee10e32fe5d7"
});

const auth = firebase.auth();
const db   = firebase.firestore();

function log(msg, type="info"){
  const el = document.getElementById("log");
  el.innerHTML += '<div class="'+type+'">'+msg+'</div>';
  el.scrollTop = el.scrollHeight;
}

async function fixCamions(){
  document.getElementById("log").innerHTML = "";
  log("🔐 Connexion admin...", "info");

  try {
    await auth.signInWithEmailAndPassword("admin@multiauto.fr", "kz0810");
    log("✅ Connecté !", "ok");

    // 1. Charger tous les chauffeurs
    log("👤 Chargement des chauffeurs...", "info");
    const usersSnap = await db.collection("users").where("role","==","chauffeur").get();
    const chauffeurs = [];
    usersSnap.forEach(d => chauffeurs.push({ uid: d.id, ...d.data() }));
    log(`✅ ${chauffeurs.length} chauffeur(s) trouvé(s)`, "ok");
    chauffeurs.forEach(ch => log(`   • ${ch.nom} — UID: ${ch.uid.substring(0,8)}...`, "info"));

    // 2. Charger tous les camions
    log("🚛 Chargement des camions...", "info");
    const camionsSnap = await db.collection("vehicules").get();
    let corriges = 0, skips = 0;

    for(const doc of camionsSnap.docs){
      const cam = doc.data();
      const defaut = cam.chauffeur_defaut || "";

      if(!defaut){ 
        log(`   ⏭ ${cam.nom} — pas de chauffeur défaut`, "warn");
        skips++;
        continue;
      }

      // Vérifier si c'est déjà un nom (pas un UID long)
      const estUID = defaut.length > 15 && !defaut.includes(" ") && defaut.match(/[A-Za-z0-9]{20,}/);
      
      if(!estUID){
        log(`   ⏭ ${cam.nom} — déjà un nom : "${defaut}"`, "warn");
        skips++;
        continue;
      }

      // Chercher le chauffeur par UID
      const chauffeur = chauffeurs.find(ch => ch.uid === defaut);
      if(chauffeur){
        await db.collection("vehicules").doc(doc.id).update({
          chauffeur_defaut: chauffeur.nom
        });
        log(`   ✅ ${cam.nom} → "${chauffeur.nom}"`, "ok");
        corriges++;
      } else {
        log(`   ❌ ${cam.nom} — UID inconnu : ${defaut.substring(0,12)}...`, "err");
      }
    }

    log("─────────────────────────────", "info");
    log(`🎉 Terminé ! ${corriges} camion(s) corrigé(s), ${skips} ignoré(s)`, "ok");

  } catch(e) {
    log("❌ Erreur : " + e.message, "err");
  }
}
</script>
</body>
</html>
